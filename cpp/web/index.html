<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>G134Office Lite</title>
<style>
  :root {
    --desk:#c7ced8; --bar:#f7f8fa; --panel:#ffffff; --line:#d5dbe3;
    --ink:#17191c; --muted:#5c6773; --accent:#2f6fed; --accent-soft:#dce8ff;
    --sheet:#ffffff; --sheet-ink:#17191c; --field:#ffffff; --hover:#edf3fb;
    --shadow:0 12px 36px rgba(20,30,40,.22);
  }
  html[data-theme="dark"] {
    --desk:#171a1f; --bar:#20242b; --panel:#252a31; --line:#353c46;
    --ink:#eef2f6; --muted:#aab3bd; --accent:#78a7ff; --accent-soft:#273c62;
    --sheet:#24282f; --sheet-ink:#eef2f6; --field:#2a3038; --hover:#303844;
    --shadow:0 12px 36px rgba(0,0,0,.45);
  }
  html[data-theme="sepia"] {
    --desk:#d8cfbd; --bar:#eee7d7; --panel:#f5efdf; --line:#c9bea8;
    --ink:#332d24; --muted:#746a59; --accent:#8b5e34; --accent-soft:#e8d5b7;
    --sheet:#fffaf0; --sheet-ink:#332d24; --field:#fffaf0; --hover:#eadfca;
    --shadow:0 12px 36px rgba(76,57,34,.20);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body {
    display:flex; flex-direction:column; background:var(--desk); color:var(--ink);
    font-family:"Segoe UI", system-ui, sans-serif; transition:background .18s ease,color .18s ease;
  }
  header { background:var(--bar); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  .row { display:flex; gap:6px; align-items:center; padding:6px 10px; flex-wrap:wrap; }
  .row + .row { border-top:1px solid color-mix(in srgb, var(--line) 70%, transparent); }
  button, select, input { font:13px "Segoe UI",system-ui,sans-serif; color:var(--ink); }
  button, select, input[type="text"] {
    background:var(--field); border:1px solid var(--line); border-radius:6px; min-height:31px;
  }
  button { padding:5px 9px; cursor:pointer; }
  select { padding:4px 8px; cursor:pointer; }
  button:hover, select:hover { background:var(--hover); }
  button.on { background:var(--accent-soft); border-color:var(--accent); }
  .sep { width:1px; height:24px; background:var(--line); margin:0 2px; }
  #q { width:155px; padding:5px 8px; }
  #name { margin-left:auto; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:35vw; }
  #zoomLabel { min-width:48px; text-align:center; color:var(--muted); font-variant-numeric:tabular-nums; }
  main { flex:1; overflow:auto; padding:24px 12px 44px; }
  .sheet {
    width:794px; min-height:1123px; margin:0 auto; background:var(--sheet); color:var(--sheet-ink);
    box-shadow:var(--shadow); transform-origin:top center; transition:background .18s ease,color .18s ease;
  }
  #page {
    min-height:1123px; padding:72px 76px; outline:none; font:16px/1.45 Calibri,"Segoe UI",sans-serif;
    white-space:pre-wrap; overflow-wrap:anywhere;
  }
  #page.nowrap { white-space:pre; overflow-wrap:normal; overflow-x:auto; }
  #page:empty:before { content:"Начните писать или перетащите файл"; color:var(--muted); opacity:.65; }
  #pdf { display:none; width:min(1080px,100%); height:calc(100vh - 160px); margin:0 auto; background:#fff; border:0; box-shadow:var(--shadow); }
  body.pdf main { padding:12px; }
  body.pdf .sheet { display:none; }
  body.pdf #pdf { display:block; }
  footer {
    display:flex; gap:16px; align-items:center; padding:6px 12px; background:var(--bar);
    border-top:1px solid var(--line); color:var(--muted); font-size:13px; min-height:31px;
  }
  footer span:last-child { margin-left:auto; }
  body.focus header .secondary, body.focus footer { display:none; }
  body.focus main { padding-top:34px; }
  body.focus header { opacity:.92; }
  .kbd { font-family:Consolas,monospace; font-size:11px; opacity:.72; }
  @media (max-width:900px) {
    main { padding:10px 4px 30px; }
    .sheet { width:100%; min-height:calc(100vh - 180px); }
    #page { min-height:calc(100vh - 180px); padding:34px 24px; }
    #name { order:99; width:100%; max-width:none; margin-left:0; }
    .sep { display:none; }
  }
  @media print {
    header, footer, #pdf { display:none !important; }
    main { padding:0; background:#fff; overflow:visible; }
    .sheet { box-shadow:none; width:auto; min-height:auto; transform:none !important; background:#fff; color:#000; display:block !important; }
    #page { min-height:auto; color:#000; }
  }
</style>
</head>
<body>
<header>
  <div class="row primary">
    <button id="modeDoc" class="on" type="button">Документ</button>
    <button id="modePdf" type="button">PDF</button>
    <span class="sep"></span>
    <button id="new" type="button" title="Ctrl+N">Создать</button>
    <button id="open" type="button" title="Ctrl+O">Открыть</button>
    <button id="save" type="button" title="Ctrl+S">Сохранить HTML</button>
    <button id="saveTxt" type="button">Сохранить TXT</button>
    <button id="topdf" type="button">Печать / PDF</button>
    <span id="name">без имени</span>
  </div>
  <div class="row secondary" id="tools">
    <select id="font" title="Шрифт">
      <option>Calibri</option><option>Times New Roman</option><option>Georgia</option>
      <option>Segoe UI</option><option>Arial</option><option>Consolas</option>
    </select>
    <select id="size" title="Размер">
      <option>12</option><option>14</option><option selected>16</option><option>18</option>
      <option>22</option><option>28</option><option>36</option>
    </select>
    <button data-cmd="bold" type="button" title="Ctrl+B"><b>B</b></button>
    <button data-cmd="italic" type="button" title="Ctrl+I"><i>I</i></button>
    <button data-cmd="underline" type="button" title="Ctrl+U"><u>U</u></button>
    <span class="sep"></span>
    <button data-cmd="justifyLeft" type="button">Лево</button>
    <button data-cmd="justifyCenter" type="button">Центр</button>
    <button data-cmd="justifyRight" type="button">Право</button>
    <button data-cmd="insertUnorderedList" type="button">• Список</button>
    <button id="undo" type="button" title="Ctrl+Z">Отменить</button>
    <span class="sep"></span>
    <input id="q" type="text" placeholder="Найти" aria-label="Найти">
    <button id="find" type="button" title="Ctrl+F">Найти</button>
  </div>
  <div class="row secondary" id="viewTools">
    <span>Тема:</span>
    <select id="theme" title="Тема интерфейса">
      <option value="system">Системная</option>
      <option value="light">Светлая</option>
      <option value="dark">Тёмная</option>
      <option value="sepia">Сепия</option>
    </select>
    <button id="wrap" class="on" type="button">Перенос строк</button>
    <span class="sep"></span>
    <button id="zoomOut" type="button" title="Ctrl+-">−</button>
    <span id="zoomLabel">100%</span>
    <button id="zoomIn" type="button" title="Ctrl++">+</button>
    <button id="zoomReset" type="button" title="Ctrl+0">100%</button>
    <span class="sep"></span>
    <button id="focus" type="button">Фокус</button>
    <button id="fullscreen" type="button">На весь экран</button>
    <span class="kbd">Ctrl+S · Ctrl+F · Ctrl+0</span>
  </div>
</header>
<main>
  <div class="sheet" id="sheet"><div id="page" contenteditable="true" spellcheck="true"></div></div>
  <iframe id="pdf" title="PDF"></iframe>
</main>
<footer>
  <span id="status">Документ · A4</span>
  <span id="cursor">Строка 1, столбец 1</span>
  <span id="draft">Черновик локально</span>
</footer>
<input id="file" type="file" accept=".txt,.html,.htm,.pdf,text/plain,text/html,application/pdf" hidden>
<script>
const $ = (id) => document.getElementById(id);
const page = $('page');
const sheet = $('sheet');
const pdf = $('pdf');
const status = $('status');
const cursor = $('cursor');
const draft = $('draft');
const nameEl = $('name');
const DRAFT_KEY = 'g134office-lite-draft-v2';
const PREF_KEY = 'g134office-lite-prefs-v2';
let fileName = 'без имени';
let dirty = false;
let pdfUrl = '';
let zoom = 100;
let wrap = true;
let saveTimer = 0;

function mark() {
  document.title = 'G134Office Lite — ' + fileName + (dirty ? ' *' : '');
  nameEl.textContent = fileName + (dirty ? ' *' : '');
}

function stats() {
  const text = page.innerText || '';
  const trimmed = text.trim();
  const words = trimmed ? trimmed.split(/\s+/).length : 0;
  const chars = text.length;
  const pages = Math.max(1, Math.ceil(chars / 3000));
  status.textContent = `Документ · слов ${words} · знаков ${chars} · ≈ ${pages} стр.`;
}

function updateCursor() {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount || !page.contains(sel.anchorNode)) {
    cursor.textContent = 'Строка —, столбец —';
    return;
  }
  const range = sel.getRangeAt(0).cloneRange();
  const pre = range.cloneRange();
  pre.selectNodeContents(page);
  pre.setEnd(range.endContainer, range.endOffset);
  const text = pre.toString();
  const parts = text.split('\n');
  const selected = sel.toString().length;
  cursor.textContent = `Строка ${parts.length}, столбец ${parts.at(-1).length + 1}` + (selected ? ` · выделено ${selected}` : '');
}

function saveDraftSoon() {
  clearTimeout(saveTimer);
  draft.textContent = 'Сохраняю черновик…';
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(DRAFT_KEY, JSON.stringify({html:page.innerHTML, fileName, savedAt:Date.now()}));
      draft.textContent = 'Черновик сохранён локально';
    } catch {
      draft.textContent = 'Черновик не сохранён';
    }
  }, 450);
}

function clearDraft() {
  localStorage.removeItem(DRAFT_KEY);
  draft.textContent = 'Черновик локально';
}

function showDoc() {
  document.body.classList.remove('pdf');
  $('modeDoc').classList.add('on');
  $('modePdf').classList.remove('on');
  $('tools').style.display = '';
  $('viewTools').style.display = '';
  stats();
}

function showPdf() {
  document.body.classList.add('pdf');
  $('modePdf').classList.add('on');
  $('modeDoc').classList.remove('on');
  $('tools').style.display = 'none';
  $('viewTools').style.display = 'none';
  status.textContent = pdfUrl ? 'PDF открыт встроенным просмотром браузера' : 'PDF не открыт';
  cursor.textContent = '';
}

function openPdf(file) {
  if (pdfUrl) URL.revokeObjectURL(pdfUrl);
  pdfUrl = URL.createObjectURL(file);
  pdf.src = pdfUrl;
  fileName = file.name;
  dirty = false;
  mark();
  showPdf();
}

async function openAny(file) {
  if (!file) return;
  if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
    openPdf(file); return;
  }
  const text = await file.text();
  if (/\.html?$/i.test(file.name)) page.innerHTML = text; else page.innerText = text;
  fileName = file.name;
  dirty = false;
  clearDraft();
  mark(); showDoc(); updateCursor();
}

function download(name, content, type) {
  const blob = new Blob([content], {type});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 0);
  dirty = false;
  mark();
}

function applyZoom(next) {
  zoom = Math.min(160, Math.max(60, next));
  sheet.style.transform = `scale(${zoom / 100})`;
  sheet.style.marginBottom = `${Math.max(0, 1123 * (zoom / 100 - 1))}px`;
  $('zoomLabel').textContent = zoom + '%';
  savePrefs();
}

function setWrap(value) {
  wrap = value;
  page.classList.toggle('nowrap', !wrap);
  $('wrap').classList.toggle('on', wrap);
  savePrefs();
}

function effectiveTheme(value) {
  if (value !== 'system') return value;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function applyTheme(value) {
  document.documentElement.dataset.theme = effectiveTheme(value);
  $('theme').value = value;
  savePrefs();
}

function savePrefs() {
  localStorage.setItem(PREF_KEY, JSON.stringify({theme:$('theme').value || 'system', zoom, wrap}));
}

function loadPrefs() {
  let prefs = {};
  try { prefs = JSON.parse(localStorage.getItem(PREF_KEY) || '{}'); } catch {}
  $('theme').value = prefs.theme || 'system';
  zoom = Number(prefs.zoom) || 100;
  wrap = prefs.wrap !== false;
  applyTheme($('theme').value);
  applyZoom(zoom);
  setWrap(wrap);
}

function restoreDraft() {
  try {
    const saved = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
    if (!saved || !saved.html) return;
    page.innerHTML = saved.html;
    fileName = saved.fileName || 'восстановленный черновик';
    dirty = true;
    draft.textContent = 'Черновик восстановлен';
    mark(); stats();
  } catch {}
}

page.addEventListener('input', () => {
  dirty = true; mark(); stats(); updateCursor(); saveDraftSoon();
});
['keyup','mouseup','focus'].forEach(evt => page.addEventListener(evt, updateCursor));

document.querySelectorAll('[data-cmd]').forEach(btn => btn.onclick = () => {
  page.focus();
  document.execCommand(btn.dataset.cmd);
  dirty = true; mark(); stats(); saveDraftSoon();
});

$('font').onchange = (e) => {
  page.focus(); document.execCommand('fontName', false, e.target.value); dirty = true; saveDraftSoon();
};
$('size').onchange = (e) => {
  page.focus();
  document.execCommand('fontSize', false, '4');
  page.querySelectorAll('font[size="4"]').forEach(n => { n.removeAttribute('size'); n.style.fontSize = e.target.value + 'px'; });
  dirty = true; saveDraftSoon();
};
$('undo').onclick = () => { document.execCommand('undo'); stats(); saveDraftSoon(); };
$('modeDoc').onclick = showDoc;
$('modePdf').onclick = showPdf;
$('new').onclick = () => {
  if (dirty && !confirm('Сбросить изменения?')) return;
  page.innerHTML = ''; fileName = 'без имени'; dirty = false; clearDraft(); mark(); showDoc(); updateCursor();
};
$('open').onclick = () => $('file').click();
$('file').onchange = (e) => { openAny(e.target.files[0]); e.target.value = ''; };
$('save').onclick = () => {
  const name = /\.html?$/i.test(fileName) ? fileName : 'document.html';
  download(name, page.innerHTML, 'text/html;charset=utf-8');
  clearDraft();
};
$('saveTxt').onclick = () => {
  const base = fileName.replace(/\.[^.]+$/, '') || 'document';
  download(base + '.txt', page.innerText, 'text/plain;charset=utf-8');
  clearDraft();
};
$('topdf').onclick = () => { showDoc(); setTimeout(() => window.print(), 60); };
$('find').onclick = () => { const q = $('q').value.trim(); if (q) window.find(q, false, false, true, false, true, false); };
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') $('find').click(); });
$('theme').onchange = e => applyTheme(e.target.value);
$('wrap').onclick = () => setWrap(!wrap);
$('zoomIn').onclick = () => applyZoom(zoom + 10);
$('zoomOut').onclick = () => applyZoom(zoom - 10);
$('zoomReset').onclick = () => applyZoom(100);
$('focus').onclick = () => { document.body.classList.toggle('focus'); $('focus').classList.toggle('on', document.body.classList.contains('focus')); };
$('fullscreen').onclick = async () => {
  if (!document.fullscreenElement) await document.documentElement.requestFullscreen?.();
  else await document.exitFullscreen?.();
};

window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); openAny(e.dataTransfer.files[0]); });
window.addEventListener('beforeunload', e => { if (dirty) e.preventDefault(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if ($('theme').value === 'system') applyTheme('system'); });

document.addEventListener('keydown', e => {
  if (!e.ctrlKey) return;
  const k = e.key.toLowerCase();
  if (k === 's') { e.preventDefault(); $('save').click(); }
  else if (k === 'o') { e.preventDefault(); $('open').click(); }
  else if (k === 'n') { e.preventDefault(); $('new').click(); }
  else if (k === 'f') { e.preventDefault(); $('q').focus(); $('q').select(); }
  else if (k === '0') { e.preventDefault(); applyZoom(100); }
  else if (k === '+' || k === '=') { e.preventDefault(); applyZoom(zoom + 10); }
  else if (k === '-') { e.preventDefault(); applyZoom(zoom - 10); }
});

loadPrefs();
restoreDraft();
mark(); showDoc(); updateCursor();
</script>
</body>
</html>
