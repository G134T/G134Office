<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<title>G134Office Lite</title>
<style>
  :root { --desk:#e6ebf1; --bar:#f7f8fa; --paper:#fff; --ink:#1c1c1c; --muted:#5c6773; --line:#d5dbe3; --accent:#1f6feb; --safe:env(safe-area-inset-bottom); }
  body.dark { --desk:#121418; --bar:#1b1e24; --paper:#20242b; --ink:#f2f4f7; --muted:#a8b0ba; --line:#343a44; --accent:#6ea8fe; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; background: var(--desk); color: var(--ink); font-family: "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 3; background: var(--bar); border-bottom: 1px solid var(--line); }
  .row { display: flex; gap: 8px; align-items: center; padding: 8px 10px; }
  .tools { overflow-x: auto; }
  button, select, input { font: 16px "Segoe UI", system-ui, sans-serif; color: var(--ink); }
  button, select { min-height: 40px; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
  button.on { background: #d9e7f7; border-color: #8eb0d4; }
  body.dark button.on { background: #24344d; }
  #title { flex: 1; min-width: 120px; border: 0; background: transparent; font-weight: 600; }
  #user { max-width: 34vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 14px; }
  main { flex: 1; overflow: auto; padding: 12px 8px calc(16px + var(--safe)); }
  .sheet { width: min(794px, 100%); min-height: 72vh; margin: 0 auto; background: var(--paper); box-shadow: 0 8px 24px rgba(0,0,0,.14); }
  #page { min-height: 72vh; padding: 22px 16px 64px; outline: none; font: 17px/1.5 Calibri, "Segoe UI", sans-serif; }
  #page:empty:before { content: "Начните писать"; color: var(--muted); }
  #pdf { display: none; width: 100%; height: calc(100vh - 150px); border: 0; background: var(--paper); }
  body.pdf .sheet, body.pdf #tools { display: none; }
  body.pdf #pdf { display: block; }
  footer { padding: 8px 12px calc(8px + var(--safe)); background: var(--bar); border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; z-index: 6; }
  .mask.open { display: block; }
  .panel { position: absolute; left: 0; right: 0; bottom: 0; max-height: 86vh; overflow: auto; background: var(--bar); color: var(--ink); border-radius: 16px 16px 0 0; padding: 14px 12px calc(16px + var(--safe)); display: grid; gap: 8px; }
  .panel h2 { margin: 2px 6px 6px; font-size: 16px; }
  .panel p, .panel label { margin: 0 6px; color: var(--muted); font-size: 13px; }
  .panel input[type=password], .panel input[type=text] { width: 100%; min-height: 42px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); padding: 8px; }
  #gists { display: grid; gap: 6px; }
  @media (min-width: 900px) { .sheet, #page { min-height: 1123px; } #page { padding: 72px 76px; } main { padding: 28px 12px 48px; } }
  @media print { header, footer, .mask, #pdf { display: none !important; } .sheet { display: block !important; box-shadow: none; width: auto; background: #fff; color: #000; } }
</style>
</head>
<body>
<header>
  <div class="row">
    <button id="modeDoc" class="on" type="button">Документ</button>
    <button id="modePdf" type="button">PDF</button>
    <input id="title" value="Без имени" aria-label="Название">
    <button id="ghBtn" type="button">GitHub</button>
    <span id="user"></span>
  </div>
  <div class="row tools" id="tools">
    <select id="font"><option>Calibri</option><option>Times New Roman</option><option>Georgia</option><option>Segoe UI</option><option>Consolas</option></select>
    <select id="size"><option>14</option><option selected>17</option><option>20</option><option>24</option><option>28</option></select>
    <button data-cmd="bold" type="button"><b>B</b></button>
    <button data-cmd="italic" type="button"><i>I</i></button>
    <button data-cmd="underline" type="button"><u>U</u></button>
    <button data-cmd="justifyLeft" type="button">Лево</button>
    <button data-cmd="justifyCenter" type="button">Центр</button>
    <button data-cmd="justifyRight" type="button">Право</button>
    <button data-cmd="insertUnorderedList" type="button">Список</button>
    <button id="undo" type="button">Отмена</button>
    <button id="theme" type="button">Тема</button>
    <button id="open" type="button">Открыть</button>
    <button id="saveBtn" type="button">Сохранить</button>
  </div>
</header>
<main>
  <div class="sheet"><div id="page" contenteditable="true"></div></div>
  <iframe id="pdf" title="PDF"></iframe>
</main>
<footer id="status">Черновик хранится в браузере</footer>
<div id="saveMenu" class="mask"><div class="panel">
  <h2>Сохранить как</h2>
  <button data-save="txt" type="button">Текст .txt</button>
  <button data-save="html" type="button">Страница .html</button>
  <button data-save="doc" type="button">Word .doc</button>
  <button data-save="md" type="button">Markdown .md</button>
  <button data-save="pdf" type="button">PDF через печать</button>
  <button data-save="gist" type="button">В Gist на GitHub</button>
  <button data-save="share" type="button">Поделиться</button>
  <button id="newDoc" type="button">Новый документ</button>
  <button data-close="saveMenu" type="button">Закрыть</button>
</div></div>
<div id="ghMenu" class="mask"><div class="panel">
  <h2>Вход через GitHub</h2>
  <p>Страница статическая, поэтому секрет OAuth сюда класть нельзя. Токен остаётся только в этом браузере.</p>
  <p><a id="tokenLink" href="https://github.com/settings/tokens/new?scopes=gist&description=G134Office%20Lite" target="_blank" rel="noopener">Создать токен с правом gist</a></p>
  <input id="token" type="password" placeholder="github_pat_... или ghp_..." autocomplete="off">
  <button id="login" type="button">Войти</button>
  <button id="logout" type="button">Выйти</button>
  <div id="gists"></div>
  <button data-close="ghMenu" type="button">Закрыть</button>
</div></div>
<input id="file" type="file" accept=".txt,.html,.md,.doc,.pdf,text/plain,text/html,application/pdf" hidden>
<script>
const page = document.getElementById('page');
const pdf = document.getElementById('pdf');
const status = document.getElementById('status');
const title = document.getElementById('title');
const userEl = document.getElementById('user');
let pdfUrl = '', gistId = localStorage.getItem('g134-gist') || '';
function token() { return localStorage.getItem('g134-token') || ''; }
function setStatus(text) { status.textContent = text; }
function words() { const t = page.innerText || ''; return t.trim() ? t.trim().split(/\s+/).length : 0; }
function showDoc() {
  document.body.classList.remove('pdf');
  document.getElementById('modeDoc').classList.add('on');
  document.getElementById('modePdf').classList.remove('on');
  setStatus('Слов ' + words() + ' · черновик в браузере');
}
function showPdf() {
  document.body.classList.add('pdf');
  document.getElementById('modePdf').classList.add('on');
  document.getElementById('modeDoc').classList.remove('on');
  setStatus(pdfUrl ? 'PDF открыт просмотром браузера' : 'PDF не открыт');
}
function saveLocal() {
  localStorage.setItem('g134-doc', JSON.stringify({title: title.value, html: page.innerHTML}));
}
function loadLocal() {
  try {
    const data = JSON.parse(localStorage.getItem('g134-doc') || '{}');
    if (data.html) page.innerHTML = data.html;
    if (data.title) title.value = data.title;
  } catch (e) {}
  document.body.classList.toggle('dark', localStorage.getItem('g134-theme') === 'dark');
}
function baseName() { return (title.value || 'document').replace(/[\\/:*?"<>|]/g, '').trim() || 'document'; }
function download(name, mime, data) {
  const blob = data instanceof Blob ? data : new Blob([data], {type: mime});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
function wordHtml() {
  return '<html><head><meta charset="utf-8"></head><body>' + page.innerHTML + '</body></html>';
}
async function gh(path, options) {
  const res = await fetch('https://api.github.com' + path, Object.assign({
    headers: {Authorization: 'Bearer ' + token(), Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
  }, options || {}));
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
async function refreshUser() {
  if (!token()) { userEl.textContent = ''; return; }
  try {
    const me = await gh('/user');
    userEl.textContent = me.login;
    document.getElementById('ghBtn').textContent = me.login;
  } catch (e) { userEl.textContent = 'токен не принят'; }
}
async function listGists() {
  const box = document.getElementById('gists');
  box.innerHTML = '';
  if (!token()) return;
  const gists = await gh('/gists?per_page=8');
  gists.filter(g => (g.description || '').startsWith('G134Office')).forEach(g => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = g.description;
    b.onclick = () => openGist(g.id);
    box.appendChild(b);
  });
}
async function openGist(id) {
  const g = await gh('/gists/' + id);
  const file = Object.values(g.files)[0];
  page.innerHTML = file.content || '';
  title.value = (g.description || 'Gist').replace(/^G134Office: /, '');
  gistId = id; localStorage.setItem('g134-gist', id); saveLocal(); showDoc();
  document.getElementById('ghMenu').classList.remove('open');
}
async function saveGist() {
  if (!token()) { document.getElementById('ghMenu').classList.add('open'); return; }
  const body = {description: 'G134Office: ' + title.value, public: false, files: {}};
  body.files[baseName() + '.html'] = {content: page.innerHTML || ' '};
  const g = gistId ? await gh('/gists/' + gistId, {method: 'PATCH', body: JSON.stringify(body)}) : await gh('/gists', {method: 'POST', body: JSON.stringify(body)});
  gistId = g.id; localStorage.setItem('g134-gist', gistId);
  setStatus('Сохранено в Gist');
}
page.addEventListener('input', () => { saveLocal(); showDoc(); });
title.addEventListener('input', saveLocal);
document.querySelectorAll('[data-cmd]').forEach(b => b.onclick = () => { page.focus(); document.execCommand(b.dataset.cmd); saveLocal(); });
document.getElementById('font').onchange = (e) => { page.focus(); document.execCommand('fontName', false, e.target.value); };
document.getElementById('size').onchange = (e) => { page.focus(); document.execCommand('fontSize', false, '4'); page.querySelectorAll('font[size="4"]').forEach(n => { n.removeAttribute('size'); n.style.fontSize = e.target.value + 'px'; }); };
document.getElementById('undo').onclick = () => document.execCommand('undo');
document.getElementById('theme').onclick = () => { document.body.classList.toggle('dark'); localStorage.setItem('g134-theme', document.body.classList.contains('dark') ? 'dark' : 'light'); };
document.getElementById('modeDoc').onclick = showDoc;
document.getElementById('modePdf').onclick = showPdf;
document.getElementById('open').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = async (e) => {
  const file = e.target.files[0]; if (!file) return;
  if (/\.pdf$/i.test(file.name)) { if (pdfUrl) URL.revokeObjectURL(pdfUrl); pdfUrl = URL.createObjectURL(file); pdf.src = pdfUrl; showPdf(); return; }
  const text = await file.text();
  if (/\.(html|htm|doc)$/i.test(file.name)) page.innerHTML = text; else page.innerText = text;
  title.value = file.name.replace(/\.[^.]+$/, ''); saveLocal(); showDoc();
};
document.getElementById('saveBtn').onclick = () => document.getElementById('saveMenu').classList.add('open');
document.getElementById('ghBtn').onclick = () => { document.getElementById('ghMenu').classList.add('open'); listGists().catch(e => setStatus(e.message)); };
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => document.getElementById(b.dataset.close).classList.remove('open'));
document.querySelectorAll('.mask').forEach(m => m.onclick = (e) => { if (e.target === m) m.classList.remove('open'); });
document.querySelectorAll('[data-save]').forEach(b => b.onclick = async () => {
  document.getElementById('saveMenu').classList.remove('open');
  const k = b.dataset.save;
  if (k === 'txt') download(baseName() + '.txt', 'text/plain;charset=utf-8', page.innerText || '');
  if (k === 'html') download(baseName() + '.html', 'text/html;charset=utf-8', page.innerHTML);
  if (k === 'doc') download(baseName() + '.doc', 'application/msword', wordHtml());
  if (k === 'md') download(baseName() + '.md', 'text/markdown;charset=utf-8', page.innerText || '');
  if (k === 'pdf') { showDoc(); setTimeout(() => window.print(), 40); }
  if (k === 'gist') saveGist().catch(e => setStatus('Не сохранилось в Gist'));
  if (k === 'share' && navigator.share) navigator.share({title: title.value, text: page.innerText || ''}).catch(() => {});
});
document.getElementById('newDoc').onclick = () => {
  document.getElementById('saveMenu').classList.remove('open');
  page.innerHTML = ''; title.value = 'Без имени'; gistId = ''; localStorage.removeItem('g134-gist'); saveLocal(); showDoc();
};
document.getElementById('login').onclick = async () => {
  localStorage.setItem('g134-token', document.getElementById('token').value.trim());
  document.getElementById('token').value = '';
  await refreshUser(); await listGists();
};
document.getElementById('logout').onclick = () => {
  localStorage.removeItem('g134-token'); userEl.textContent = ''; document.getElementById('ghBtn').textContent = 'GitHub'; document.getElementById('gists').innerHTML = '';
};
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) document.getElementById('file').onchange({target:{files:[f]}}); });
loadLocal(); refreshUser(); showDoc();
</script>
</body>
</html>
