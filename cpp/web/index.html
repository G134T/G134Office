<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G134Office Lite</title>
<style>
  :root { --desk:#d7dbe2; --ink:#1c1c1c; --bar:#f4f5f7; --line:#c8ced6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; background: var(--desk); color: var(--ink); font-family: "Segoe UI", sans-serif; }
  header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--bar); border-bottom: 1px solid var(--line); }
  button, input { font: inherit; }
  button { background: #fff; border: 1px solid #b7bec7; border-radius: 4px; padding: 6px 12px; cursor: pointer; }
  button:hover { background: #eef3f8; }
  #q { width: 180px; padding: 6px 8px; border: 1px solid #b7bec7; border-radius: 4px; }
  #name { margin-left: auto; color: #4d5660; }
  main { flex: 1; overflow: auto; padding: 28px 16px 40px; }
  .sheet { width: min(820px, 100%); min-height: 980px; margin: 0 auto; background: #fff; box-shadow: 0 8px 28px rgba(0,0,0,.18); }
  textarea { width: 100%; min-height: 980px; border: 0; resize: none; padding: 64px 72px; font: 16px/1.45 Consolas, "Segoe UI", sans-serif; color: var(--ink); background: transparent; outline: none; }
  textarea.nowrap { white-space: pre; }
  footer { padding: 6px 12px; background: var(--bar); border-top: 1px solid var(--line); color: #4d5660; font-size: 13px; }
</style>
</head>
<body>
<header>
  <button id="new" type="button">Создать</button>
  <button id="open" type="button">Открыть</button>
  <button id="save" type="button">Сохранить</button>
  <input id="q" placeholder="Найти">
  <button id="find" type="button">Найти</button>
  <button id="wrap" type="button">Перенос</button>
  <button id="plus" type="button">A+</button>
  <button id="minus" type="button">A−</button>
  <span id="name">без имени</span>
</header>
<main>
  <div class="sheet"><textarea id="editor" spellcheck="false" placeholder="Начните писать"></textarea></div>
</main>
<footer id="status">Строка 1, столбец 1 · UTF-8 · 16 px</footer>
<input id="file" type="file" accept=".txt,text/plain" hidden>
<script>
const editor = document.getElementById('editor');
const status = document.getElementById('status');
const nameEl = document.getElementById('name');
let fileName = 'без имени', dirty = false, size = 16, findFrom = 0;
function mark() {
  document.title = 'G134Office Lite — ' + fileName + (dirty ? ' *' : '');
  nameEl.textContent = fileName + (dirty ? ' *' : '');
}
function place() {
  const pos = editor.selectionStart;
  const upto = editor.value.slice(0, pos);
  const line = upto.split('\n').length;
  const col = upto.length - upto.lastIndexOf('\n');
  status.textContent = 'Строка ' + line + ', столбец ' + col + ' · UTF-8 · ' + size + ' px';
}
editor.addEventListener('input', () => { dirty = true; mark(); place(); });
editor.addEventListener('keyup', place);
editor.addEventListener('click', place);
document.getElementById('new').onclick = () => {
  if (dirty && !confirm('Сбросить изменения?')) return;
  editor.value = ''; fileName = 'без имени'; dirty = false; mark(); place();
};
document.getElementById('open').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = async (e) => {
  const file = e.target.files[0]; if (!file) return;
  editor.value = await file.text(); fileName = file.name; dirty = false; mark(); place();
};
document.getElementById('save').onclick = () => {
  const blob = new Blob([editor.value], {type: 'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fileName.endsWith('.txt') ? fileName : 'document.txt';
  a.click(); URL.revokeObjectURL(a.href); dirty = false; mark();
};
document.getElementById('find').onclick = () => {
  const q = document.getElementById('q').value; if (!q) return;
  let at = editor.value.indexOf(q, findFrom);
  if (at < 0) at = editor.value.indexOf(q);
  if (at < 0) { status.textContent = 'Не найдено'; return; }
  editor.focus(); editor.setSelectionRange(at, at + q.length); findFrom = at + q.length; place();
};
document.getElementById('wrap').onclick = () => editor.classList.toggle('nowrap');
document.getElementById('plus').onclick = () => { size = Math.min(32, size + 2); editor.style.fontSize = size + 'px'; place(); };
document.getElementById('minus').onclick = () => { size = Math.max(12, size - 2); editor.style.fontSize = size + 'px'; place(); };
window.addEventListener('beforeunload', (e) => { if (dirty) e.preventDefault(); });
mark(); place();
</script>
</body>
</html>
