<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>G134Office Lite</title>
<style>
  :root { --desk:#e7ebf0; --bar:#f7f8fa; --line:#d5dbe3; --ink:#1a1a1a; --safe-b: env(safe-area-inset-bottom); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; background: var(--desk); color: var(--ink); font-family: "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bar); border-bottom: 1px solid var(--line); }
  .row { display: flex; gap: 8px; align-items: center; padding: 8px 10px; }
  .tools { overflow-x: auto; -webkit-overflow-scrolling: touch; white-space: nowrap; }
  button, select, input { font: 16px "Segoe UI", system-ui, sans-serif; }
  button, select { min-height: 40px; background: #fff; border: 1px solid #c5ccd6; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.on { background: #d9e7f7; border-color: #8eb0d4; }
  #q { width: 140px; min-height: 40px; padding: 6px 8px; border: 1px solid #c5ccd6; border-radius: 8px; }
  #name { margin-left: auto; color: #52606d; font-size: 14px; max-width: 42vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  main { flex: 1; overflow: auto; padding: 12px 8px calc(18px + var(--safe-b)); }
  .sheet { width: min(794px, 100%); min-height: 70vh; margin: 0 auto; background: #fff; box-shadow: 0 6px 22px rgba(20,30,40,.16); border-radius: 2px; }
  #page { min-height: 70vh; padding: 22px 16px 48px; outline: none; font: 17px/1.5 Calibri, "Segoe UI", sans-serif; }
  #page:empty:before { content: "Начните писать или перетащите файл"; color: #9aa3ad; }
  #pdf { display: none; width: 100%; height: calc(100vh - 150px); border: 0; background: #fff; }
  body.pdf .sheet { display: none; }
  body.pdf #pdf { display: block; }
  body.pdf #tools { display: none; }
  footer { padding: 8px 12px calc(8px + var(--safe-b)); background: var(--bar); border-top: 1px solid var(--line); color: #52606d; font-size: 13px; }
  #menu { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 5; }
  #menu.open { display: block; }
  #menu .panel { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 16px 16px 0 0; padding: 12px 12px calc(16px + var(--safe-b)); display: grid; gap: 8px; }
  #menu h2 { margin: 4px 8px 8px; font-size: 16px; }
  @media (min-width: 900px) {
    .sheet { min-height: 1123px; }
    #page { min-height: 1123px; padding: 72px 76px; }
    main { padding: 28px 12px 48px; }
  }
  @media print {
    header, footer, #pdf, #menu { display: none !important; }
    main { padding: 0; background: #fff; }
    .sheet { box-shadow: none; width: auto; display: block !important; }
  }
</style>
</head>
<body>
<header>
  <div class="row">
    <button id="modeDoc" class="on" type="button">Документ</button>
    <button id="modePdf" type="button">PDF</button>
    <button id="open" type="button">Открыть</button>
    <button id="saveBtn" type="button">Сохранить</button>
    <span id="name">без имени</span>
  </div>
  <div class="row tools" id="tools">
    <select id="font"><option>Calibri</option><option>Times New Roman</option><option>Georgia</option><option>Segoe UI</option><option>Consolas</option></select>
    <select id="size"><option>14</option><option selected>17</option><option>20</option><option>24</option><option>28</option></select>
    <button data-cmd="bold" type="button"><b>B</b></button>
    <button data-cmd="italic" type="button"><i>I</i></button>
    <button data-cmd="underline" type="button"><u>U</u></button>
    <button data-cmd="justifyLeft" type="button">Лево</button>
    <button data-cmd="justifyCenter" type="button">Центр</button>
    <button data-cmd="justifyRight" type="button">Право</button>
    <button data-cmd="insertUnorderedList" type="button">Список</button>
    <button id="undo" type="button">Отмена</button>
    <input id="q" placeholder="Найти">
    <button id="find" type="button">Найти</button>
  </div>
</header>
<main>
  <div class="sheet"><div id="page" contenteditable="true"></div></div>
  <iframe id="pdf" title="PDF"></iframe>
</main>
<footer id="status">Документ · файл остаётся в браузере</footer>
<div id="menu">
  <div class="panel">
    <h2>Сохранить как</h2>
    <button data-save="txt" type="button">Текст .txt</button>
    <button data-save="html" type="button">Страница .html</button>
    <button data-save="doc" type="button">Word .doc</button>
    <button data-save="md" type="button">Markdown .md</button>
    <button data-save="pdf" type="button">PDF через печать</button>
    <button data-save="share" type="button">Поделиться</button>
    <button id="new" type="button">Новый документ</button>
    <button id="closeMenu" type="button">Закрыть</button>
  </div>
</div>
<input id="file" type="file" accept=".txt,.html,.md,.doc,.pdf,text/plain,text/html,application/pdf" hidden>
<script>
const page = document.getElementById('page');
const pdf = document.getElementById('pdf');
const status = document.getElementById('status');
const nameEl = document.getElementById('name');
const menu = document.getElementById('menu');
let fileName = 'без имени', dirty = false, pdfUrl = '';
function mark() {
  document.title = 'G134Office Lite — ' + fileName + (dirty ? ' *' : '');
  nameEl.textContent = fileName + (dirty ? ' *' : '');
}
function words() {
  const text = page.innerText || '';
  return text.trim() ? text.trim().split(/\s+/).length : 0;
}
function showDoc() {
  document.body.classList.remove('pdf');
  document.getElementById('modeDoc').classList.add('on');
  document.getElementById('modePdf').classList.remove('on');
  status.textContent = 'Документ · слов ' + words();
}
function showPdf() {
  document.body.classList.add('pdf');
  document.getElementById('modePdf').classList.add('on');
  document.getElementById('modeDoc').classList.remove('on');
  status.textContent = pdfUrl ? 'PDF открыт просмотром браузера' : 'PDF не открыт';
}
function baseName() {
  return fileName.replace(/\.[^.]+$/, '') || 'document';
}
function download(name, mime, data) {
  const blob = data instanceof Blob ? data : new Blob([data], {type: mime});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
  dirty = false;
  fileName = name;
  mark();
}
function wordHtml() {
  return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"></head><body>' + page.innerHTML + '</body></html>';
}
function markdown() {
  return (page.innerText || '').replace(/\u00a0/g, ' ');
}
function openPdf(file) {
  if (pdfUrl) URL.revokeObjectURL(pdfUrl);
  pdfUrl = URL.createObjectURL(file);
  pdf.src = pdfUrl;
  fileName = file.name;
  dirty = false;
  mark();
  showPdf();
}
async function openAny(file) {
  if (!file) return;
  if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) { openPdf(file); return; }
  const text = await file.text();
  if (/\.(html|htm|doc)$/i.test(file.name)) page.innerHTML = text; else page.innerText = text;
  fileName = file.name; dirty = false; mark(); showDoc();
}
page.addEventListener('input', () => { dirty = true; mark(); showDoc(); });
document.querySelectorAll('[data-cmd]').forEach(btn => btn.onclick = () => { page.focus(); document.execCommand(btn.dataset.cmd); dirty = true; mark(); });
document.getElementById('font').onchange = (e) => { page.focus(); document.execCommand('fontName', false, e.target.value); };
document.getElementById('size').onchange = (e) => { page.focus(); document.execCommand('fontSize', false, '4'); page.querySelectorAll('font[size="4"]').forEach(n => { n.removeAttribute('size'); n.style.fontSize = e.target.value + 'px'; }); };
document.getElementById('undo').onclick = () => document.execCommand('undo');
document.getElementById('modeDoc').onclick = showDoc;
document.getElementById('modePdf').onclick = showPdf;
document.getElementById('open').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = (e) => openAny(e.target.files[0]);
document.getElementById('saveBtn').onclick = () => menu.classList.add('open');
document.getElementById('closeMenu').onclick = () => menu.classList.remove('open');
menu.onclick = (e) => { if (e.target === menu) menu.classList.remove('open'); };
document.querySelectorAll('[data-save]').forEach(btn => btn.onclick = async () => {
  const kind = btn.dataset.save;
  menu.classList.remove('open');
  if (kind === 'txt') download(baseName() + '.txt', 'text/plain;charset=utf-8', page.innerText || '');
  if (kind === 'html') download(baseName() + '.html', 'text/html;charset=utf-8', page.innerHTML);
  if (kind === 'doc') download(baseName() + '.doc', 'application/msword', wordHtml());
  if (kind === 'md') download(baseName() + '.md', 'text/markdown;charset=utf-8', markdown());
  if (kind === 'pdf') { showDoc(); setTimeout(() => window.print(), 50); }
  if (kind === 'share') {
    const file = new File([page.innerText || ''], baseName() + '.txt', {type: 'text/plain'});
    if (navigator.share) await navigator.share({title: fileName, files: [file]}).catch(() => navigator.share({title: fileName, text: page.innerText || ''}));
    else status.textContent = 'На этом устройстве нет кнопки Поделиться';
  }
});
document.getElementById('new').onclick = () => {
  menu.classList.remove('open');
  if (dirty && !confirm('Сбросить изменения?')) return;
  page.innerHTML = ''; fileName = 'без имени'; dirty = false; mark(); showDoc();
};
document.getElementById('find').onclick = () => { const q = document.getElementById('q').value; if (q) window.find(q); };
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => { e.preventDefault(); openAny(e.dataTransfer.files[0]); });
window.addEventListener('beforeunload', (e) => { if (dirty) e.preventDefault(); });
mark(); showDoc();
</script>
</body>
</html>
