<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa" id="themeMeta">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="G134Office Lite — лёгкий редактор документов с C++ WebAssembly, DOCX, ODT, RTF, TXT и PDF.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="app-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css?v=20261002-1">
  <link rel="stylesheet" href="font-size-control.css?v=20261002-1">
  <link rel="stylesheet" href="word-layout.css?v=20261002-2">
  <title>G134Office Lite</title>
</head>
<body data-theme="light" data-layout="desktop">
  <header class="app-header">
    <div class="top-row row">
      <div class="brand" aria-label="G134Office Lite">
        <span class="brand-mark" aria-hidden="true">G</span>
        <span class="brand-copy"><strong>G134Office</strong><small>Lite</small></span>
      </div>
      <div class="primary-actions" role="group" aria-label="Файл">
        <button id="new" type="button" title="Новый документ (Ctrl+N)">Новый</button>
        <button id="open" type="button" title="Открыть файл (Ctrl+O)">Открыть</button>
        <button id="saveBtn" class="primary" type="button" title="Сохранить (Ctrl+S)">Сохранить</button>
      </div>
      <div class="spacer"></div>
      <span id="engine" class="engine-pill">C++: загрузка…</span>
      <span id="name" class="file-name">без имени</span>
    </div>

    <div class="view-row row" id="layoutRow">
      <span class="row-label">Вид</span>
      <label class="auto-check"><input id="autoLayout" type="checkbox" checked> Авто</label>
      <div class="segmented" role="group" aria-label="Режим отображения">
        <button type="button" data-layout-mode="phone" aria-label="Телефон">📱 <span>Телефон</span></button>
        <button type="button" data-layout-mode="tablet" aria-label="Планшет">▣ <span>Планшет</span></button>
        <button type="button" data-layout-mode="desktop" aria-label="Компьютер">🖥 <span>ПК</span></button>
      </div>
      <span id="deviceState" class="device-state">Определение устройства…</span>
      <div class="spacer"></div>
      <button id="focusBtn" type="button">Фокус</button>
      <button id="fullBtn" type="button">Полный экран</button>
    </div>

    <div class="format-row row" id="tools" aria-label="Форматирование">
      <select id="theme" title="Тема интерфейса" aria-label="Тема">
        <option value="system">Системная тема</option>
        <option value="light">Светлая</option>
        <option value="dark">Тёмная</option>
        <option value="sepia">Сепия</option>
      </select>
      <select id="blockStyle" title="Стиль абзаца" aria-label="Стиль абзаца">
        <option value="p">Обычный</option>
        <option value="h1">Заголовок 1</option>
        <option value="h2">Заголовок 2</option>
        <option value="blockquote">Цитата</option>
      </select>
      <select id="font" title="Шрифт" aria-label="Шрифт">
        <option>Calibri</option><option>Times New Roman</option><option>Georgia</option><option>Segoe UI</option><option>Consolas</option>
      </select>
      <div class="font-size-group" role="group" aria-label="Размер шрифта">
        <button id="fontSizeDown" type="button" title="Уменьшить размер шрифта" aria-label="Уменьшить размер шрифта">−</button>
        <input id="size" type="number" min="8" max="96" step="1" value="17" inputmode="numeric" title="Размер шрифта от 8 до 96 px" aria-label="Размер шрифта">
        <button id="fontSizeUp" type="button" title="Увеличить размер шрифта" aria-label="Увеличить размер шрифта">+</button>
        <span class="font-unit" aria-hidden="true">px</span>
      </div>
      <span class="tool-divider" aria-hidden="true"></span>
      <button data-cmd="bold" type="button" class="icon-btn" title="Жирный (Ctrl+B)"><b>B</b></button>
      <button data-cmd="italic" type="button" class="icon-btn" title="Курсив (Ctrl+I)"><i>I</i></button>
      <button data-cmd="underline" type="button" class="icon-btn" title="Подчёркивание (Ctrl+U)"><u>U</u></button>
      <button id="clearFormat" type="button" class="icon-btn" title="Очистить форматирование">Tx</button>
      <span class="tool-divider" aria-hidden="true"></span>
      <button data-cmd="justifyLeft" type="button" class="icon-btn" title="По левому краю">⇤</button>
      <button data-cmd="justifyCenter" type="button" class="icon-btn" title="По центру">≡</button>
      <button data-cmd="justifyRight" type="button" class="icon-btn" title="По правому краю">⇥</button>
      <button data-cmd="insertUnorderedList" type="button" title="Маркированный список">• Список</button>
      <button data-cmd="insertOrderedList" type="button" title="Нумерованный список">1. Список</button>
      <span class="tool-divider" aria-hidden="true"></span>
      <button id="undo" type="button" class="icon-btn" title="Отменить (Ctrl+Z)">↶</button>
      <button id="redo" type="button" class="icon-btn" title="Повторить (Ctrl+Y)">↷</button>
      <button id="wrapBtn" class="on" type="button">Перенос</button>
      <div class="zoom-group" role="group" aria-label="Масштаб">
        <button id="zoomOut" type="button" aria-label="Уменьшить масштаб">−</button>
        <button id="zoomReset" type="button">100%</button>
        <button id="zoomIn" type="button" aria-label="Увеличить масштаб">+</button>
      </div>
      <details class="search-box" id="searchBox">
        <summary>Найти</summary>
        <div class="search-popover">
          <input id="q" placeholder="Найти" autocomplete="off">
          <input id="replaceText" placeholder="Заменить на" autocomplete="off">
          <div class="search-actions">
            <button id="find" type="button">Далее</button>
            <button id="replaceOne" type="button">Заменить</button>
            <button id="replaceAll" type="button">Заменить всё</button>
          </div>
        </div>
      </details>
    </div>
  </header>

  <main id="workspace">
    <div class="sheet" id="sheet">
      <div id="page" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true" aria-label="Документ"></div>
    </div>
    <iframe id="pdf" title="Просмотр PDF"></iframe>
  </main>

  <footer class="status-bar">
    <span id="status">Документ</span>
    <span id="cursor">Стр 1 · Стлб 1</span>
    <span id="autosave">Автосохранение включено</span>
    <span id="layoutFooter">Вид: авто</span>
  </footer>

  <div id="saveDialog" class="modal" aria-hidden="true">
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="saveTitle">
      <div class="modal-head"><div><h2 id="saveTitle">Сохранить документ</h2><p>Выберите имя и настоящий формат файла.</p></div><button id="closeSave" type="button" class="icon-btn" aria-label="Закрыть">✕</button></div>
      <label class="field"><span>Имя файла</span><input id="saveName" value="document"></label>
      <div class="format-grid">
        <button class="format-card" data-save="docx" type="button"><strong>DOCX</strong><span>Microsoft Word / Google Docs</span></button>
        <button class="format-card" data-save="odt" type="button"><strong>ODT</strong><span>OpenDocument / LibreOffice</span></button>
        <button class="format-card" data-save="rtf" type="button"><strong>RTF</strong><span>Rich Text с Unicode</span></button>
        <button class="format-card" data-save="txt" type="button"><strong>TXT</strong><span>Обычный UTF-8 текст</span></button>
        <button class="format-card" data-save="pdf" type="button"><strong>PDF</strong><span>Через системную печать в PDF</span></button>
        <button class="format-card" data-save="share" type="button"><strong>Поделиться</strong><span>Отправить текст через меню устройства</span></button>
      </div>
      <p class="privacy-note">DOCX, ODT, RTF и TXT формируются локально в браузере. Текст документа не отправляется на сервер.</p>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="file" type="file" accept=".txt,.html,.htm,.rtf,.docx,.odt,.pdf,text/plain,text/html,application/rtf,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.oasis.opendocument.text" hidden>

  <script src="g134lite.js?v=20261002-3"></script>
  <script src="editor.js?v=20261002-1"></script>
  <script src="font-size-control.js?v=20261002-1"></script>
  <script src="word-layout.js?v=20261002-1"></script>
  <script src="scroll-behavior.js?v=20261002-1"></script>
  <!-- G134_GITHUB_ACCOUNT -->
</body>
</html>
