name: Create v1.0.1 tag

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/create-v1.0.1-tag.yml"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create v1.0.1 tag
        shell: bash
        run: |
          if git rev-parse "v1.0.1" >/dev/null 2>&1; then
            echo "Tag v1.0.1 already exists."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v1.0.1" -m "G134Office v1.0.1"
          git push origin "v1.0.1"
