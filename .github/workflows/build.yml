name: Build and sign Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: 55cc375f-6d2c-403b-a8b6-88c80191aeb6
      SIGNPATH_PROJECT_SLUG: 906e50d7-31fb-4951-8b02-f49461c4718f
      SIGNPATH_POLICY_SLUG: d4f25173-55f4-4ba4-b733-d64192be40f6
      SIGNPATH_ARTIFACT_CONFIG_SLUG: d7dda586-5a47-4c2f-9d0b-df9931767a6b
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "26"
          java-package: jdk+jmods

      - name: Require JDK JMODs
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $javaHome = $env:JAVA_HOME
          if ($javaHome -match '\+') {
            $dest = "C:\jdk-26"
            if (Test-Path -LiteralPath $dest) { Remove-Item -LiteralPath $dest -Recurse -Force }
            New-Item -ItemType Directory -Path $dest | Out-Null
            & robocopy $javaHome $dest /E /NFL /NDL /NJH /NJS /NC /NS | Out-Null
            if ($LASTEXITCODE -ge 8) { throw "Could not copy the JDK to a path without '+': $dest" }
            $javaHome = $dest
            [System.IO.File]::AppendAllText($env:GITHUB_ENV, "JAVA_HOME=$javaHome`n")
            [System.IO.File]::AppendAllText($env:GITHUB_PATH, "$javaHome\bin`n")
          }
          $jmod = Join-Path $javaHome "jmods\java.base.jmod"
          if (-not (Test-Path -LiteralPath $jmod)) {
            throw "JDK JMODs were not installed: $jmod"
          }
          $normalized = $javaHome.Replace("\", "/")
          $props = "`r`norg.gradle.java.installations.auto-detect=false`r`norg.gradle.java.installations.auto-download=false`r`norg.gradle.java.installations.paths=$normalized`r`n"
          [System.IO.File]::AppendAllText((Join-Path (Get-Location) "gradle.properties"), $props)
          Write-Host "jlink will use $jmod"

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --yes --no-progress
          $iscc = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not $iscc) { throw "ISCC.exe was not found after installing Inno Setup." }
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "INNO_SETUP_HOME=$(Split-Path -Parent $iscc)`n")

      - name: Run tests
        shell: cmd
        run: .\gradlew.bat test --no-daemon

      - name: Build application image
        shell: cmd
        run: .\build-release.cmd

      - name: Build installer
        shell: cmd
        run: .\build-installer.cmd

      - name: Upload unsigned installer
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: G134Office-Setup-unsigned
          path: build/installer/G134Office-Setup-*.exe
          archive: false
          if-no-files-found: error

      - name: Sign installer with SignPath
        id: signpath
        continue-on-error: true
        if: >-
          github.ref_type == 'tag' &&
          env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          connector-url: https://pipelineconnector.connectors.signpath.io/GitHub/GitHubCom
          api-token: ${{ env.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          skip-decompress: true
          output-artifact-directory: signed

      - name: Report SignPath failure
        if: always() && steps.signpath.outcome == 'failure'
        shell: powershell
        run: |
          Write-Warning "SignPath signing failed. The unsigned installer was built and uploaded successfully. Check the SignPath trusted build system and organization configuration."

      - name: Verify signed installer
        if: steps.signpath.outcome == 'success'
        shell: powershell
        run: |
          $signedInstallers = @(Get-ChildItem -LiteralPath signed -Filter 'G134Office-Setup-*.exe' -File)
          if ($signedInstallers.Count -ne 1) { throw "Expected one signed installer, found $($signedInstallers.Count)." }
          $signature = Get-AuthenticodeSignature -LiteralPath $signedInstallers[0].FullName
          if ($signature.Status -ne 'Valid') { throw "Signed installer has status $($signature.Status)." }
          Write-Host "Signed by $($signature.SignerCertificate.Subject)"

      - name: Upload signed installer
        if: steps.signpath.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: G134Office-Setup-signed
          path: signed/G134Office-Setup-*.exe
          archive: false
          if-no-files-found: error

      - name: Report unsigned release artifact
        if: >-
          github.ref_type == 'tag' &&
          env.SIGNPATH_API_TOKEN == ''
        shell: powershell
        run: Write-Host "SIGNPATH_API_TOKEN is missing; only the unsigned installer artifact is available."
