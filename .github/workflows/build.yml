name: Build and Sign Application

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 26
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '26'

    - name: Install Inno Setup
      shell: powershell
      run: choco install innosetup --yes --no-progress

    - name: Build project with Gradle
      run: .\gradlew.bat build --no-daemon
      shell: cmd

    - name: Run release build script
      run: .\build-release.cmd
      shell: cmd

    - name: Run installer build script (Inno Setup)
      run: .\build-installer.cmd
      shell: cmd

    - name: Upload unsigned installer
      id: upload-installer
      uses: actions/upload-artifact@v4
      with:
        name: G134Office-Setup-unsigned
        path: build/installer/G134Office-Setup-1.0.0.exe

    # SignPath получает артефакт из GitHub Actions, а не из локального пути.
    - name: Sign artifact with SignPath
      uses: signpath/github-action-submit-signing-request@v3
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
        signing-policy-slug: ${{ secrets.SIGNPATH_POLICY_SLUG }}
        artifact-configuration-slug: ${{ secrets.SIGNPATH_ARTIFACT_CONFIG_SLUG }}
        github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
        wait-for-completion: true
        output-artifact-directory: signed
