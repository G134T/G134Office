name: Lite in browser

on:
  push:
    branches: [main]
    paths:
      - cpp/CMakeLists.txt
      - cpp/web/**
      - oauth-backend/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      G134_AUTH_BASE_URL: ${{ vars.G134_AUTH_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Emscripten and CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten cmake
          em++ --version
          cmake --version

      - name: Build C++ WebAssembly core
        shell: bash
        run: |
          emcmake cmake -S cpp -B build/wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build/wasm --config Release --target G134OfficeLiteCore

      - name: Prepare GitHub account integration
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          base = os.environ.get('G134_AUTH_BASE_URL', '').rstrip('/')
          sha = os.environ.get('GITHUB_SHA', '')[:12]
          Path('cpp/web/oauth-config.js').write_text(
              'window.G134OfficeAuth = ' + json.dumps({'baseUrl': base}, ensure_ascii=False) + ';\n',
              encoding='utf-8'
          )

          index = Path('cpp/web/index.html')
          text = index.read_text(encoding='utf-8')
          marker = '<!-- G134_GITHUB_ACCOUNT -->'
          block = (
              marker + '\n'
              + f'<script src="oauth-config.js?v={sha}"></script>\n'
              + f'<script src="github-account.js?v={sha}"></script>\n'
          )
          if marker in text:
              start = text.index(marker)
              end = text.find('</body>', start)
              if end < 0:
                  raise SystemExit('Missing </body> after GitHub account marker')
              text = text[:start] + block + text[end:]
          else:
              if '</body>' not in text:
                  raise SystemExit('Missing </body> in cpp/web/index.html')
              text = text.replace('</body>', block + '</body>', 1)
          index.write_text(text, encoding='utf-8')
          PY

      - name: Verify web bundle
        shell: bash
        run: |
          test -s cpp/web/index.html
          test -s cpp/web/app.css
          test -s cpp/web/editor.js
          test -s cpp/web/font-size-control.css
          test -s cpp/web/font-size-control.js
          test -s cpp/web/word-layout.css
          test -s cpp/web/word-layout.js
          test -s cpp/web/scroll-behavior.js
          test -s cpp/web/manifest.webmanifest
          test -s cpp/web/app-icon.svg
          test -s cpp/web/g134lite.js
          test -s cpp/web/g134lite.wasm
          test -s cpp/web/oauth-config.js
          test -s cpp/web/github-account.js
          node --check cpp/web/editor.js
          node --check cpp/web/font-size-control.js
          node --check cpp/web/word-layout.js
          node --check cpp/web/scroll-behavior.js
          grep -q 'G134_GITHUB_ACCOUNT' cpp/web/index.html
          grep -q 'editor.js' cpp/web/index.html
          grep -q 'word-layout.js' cpp/web/index.html
          grep -q 'word-layout.css' cpp/web/index.html
          grep -q 'scroll-behavior.js' cpp/web/index.html
          grep -q 'app.css' cpp/web/index.html
          ! grep -Fq 'function printPdf()' cpp/web/index.html
          ! grep -Fq '<script>onload=()=>setTimeout(()=>print(),150)' cpp/web/index.html
          ls -lh cpp/web/index.html cpp/web/app.css cpp/web/editor.js cpp/web/word-layout.css cpp/web/word-layout.js cpp/web/scroll-behavior.js cpp/web/g134lite.js cpp/web/g134lite.wasm

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cpp/web

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
