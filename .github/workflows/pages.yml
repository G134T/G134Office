name: Lite in browser

on:
  push:
    branches: [main]
    paths:
      - cpp/CMakeLists.txt
      - cpp/web/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Emscripten and CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y emscripten cmake
          em++ --version
          cmake --version

      - name: Build C++ WebAssembly core
        shell: bash
        run: |
          emcmake cmake -S cpp -B build/wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build/wasm --config Release --target G134OfficeLiteCore

      - name: Verify web bundle
        shell: bash
        run: |
          test -s cpp/web/index.html
          test -s cpp/web/g134lite.js
          test -s cpp/web/g134lite.wasm
          ls -lh cpp/web/g134lite.js cpp/web/g134lite.wasm

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cpp/web

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
