name: Lite in browser

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cpp/web
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Pages not enabled
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "GitHub Pages is not enabled. Open Settings, Pages, Source, GitHub Actions."
          echo "Until then the editor is at cpp/web/index.html"
          exit 0
