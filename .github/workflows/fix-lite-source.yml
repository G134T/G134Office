name: Fix Lite HTML source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-lite-source.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Replace unsafe nested script in PDF export
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('cpp/web/index.html')
          text = p.read_text(encoding='utf-8')
          start = text.find('function printPdf(){')
          end = text.find('async function exportFormat', start)
          if start < 0 or end < 0:
              raise SystemExit('printPdf/exportFormat boundary not found')

          safe = '''function printPdf(){
            const w=window.open('','_blank');
            if(!w){alert('Разрешите всплывающее окно для сохранения PDF.');return}
            w.document.open();
            w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${xml(baseName())}</title><style>body{font-family:Calibri,Arial,sans-serif;margin:0}main{width:170mm;margin:auto;padding:18mm 20mm;font-size:12pt;line-height:1.5}@page{size:A4;margin:0}</style></head><body><main id="printRoot"></main></body></html>`);
            w.document.close();
            const root=w.document.getElementById('printRoot');
            if(root)root.innerHTML=page.innerHTML;
            setTimeout(()=>{w.focus();w.print()},250);
          }
          '''
          text = text[:start] + safe + text[end:]
          if '<script>onload=()=>setTimeout(()=>print(),150)' in text:
              raise SystemExit('unsafe nested script still present')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "G134Office CI"
          git config user.email "actions@users.noreply.github.com"
          git add cpp/web/index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix(lite): remove nested script from PDF export"
          git push
